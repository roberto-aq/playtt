name: prueba_reproductor
description: "Reproductor de música local para Android con descarga de audio desde TikTok."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícono de la app. Para regenerarlo tras cambiar la imagen:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/playtt_icon.png"
  min_sdk_android: 24
  # Ícono adaptable (Android 8+): cada fabricante lo recorta con su forma
  # (círculo, cuadrado redondeado...). El margen evita que se corten las ondas.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/playtt_icon.png"
  adaptive_icon_foreground_inset: 16
